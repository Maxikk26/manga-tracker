[project]
name = "manga-tracker"
version = "0.1.0"
description = "Manganato chapter tracker: source client, discovery, Telegram digest, scheduler"
requires-python = ">=3.12"
dependencies = [
    # D11 capped this at <0.15 (avoids curl-cffi's `rich` pull); lifted here
    # because GHSA-qw2m-4pqf-rmpp (SSRF, HIGH) is open on 0.13.x/0.14.x and
    # fixed only in 0.15.0 — an open advisory outranks D11's closure-size preference.
    "curl-cffi>=0.15",
    "beautifulsoup4>=4.12",
    "APScheduler>=3.10,<4",
    # The V1b panel (spec-panel-v1b.md): FastAPI serves the JSON API and the
    # frontend statics, uvicorn runs it as its own process/container.
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
# httpx: what fastapi.testclient.TestClient speaks; test-only, never runtime.
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Required so two suites can name their file after the module they test:
# `tests/catalogue/test_transport.py` and `tests/sources/test_transport.py`
# collide under the default `prepend` import mode, which derives a module name
# from the basename alone and refuses the second one. `importlib` gives each
# file its own module identity without turning `tests/` into a package.
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["manga_tracker"]
