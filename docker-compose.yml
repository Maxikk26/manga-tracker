services:
  manga-tracker:
    build: .
    # Same reason as container_name below: without this, Compose names the
    # built image `<project>-<service>` — manga-tracker-manga-tracker. One
    # service, one image; name it once. After deploying this change, the old
    # image name lingers untagged: `docker image rm manga-tracker-manga-tracker`.
    image: manga-tracker
    # Without this, Compose derives `<project>-<service>-<N>` and the container
    # is called manga-tracker-manga-tracker-1. The suffix exists to keep
    # replicas apart, and this service is one instance by definition: a single
    # SQLite file and a scheduler with max_workers=1. Naming it explicitly also
    # shortens every log line, since Compose prefixes output with the name.
    container_name: manga-tracker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides the .env value on purpose, and the two are not redundant.
      # Inside the container this is relative to WORKDIR /app, so it lands on
      # the mount below. The .env value is for running the CLI on the host
      # without Docker, and points at the same physical directory from there.
      # Both therefore address one database; only the route differs.
      DB_PATH: data/manga-tracker.db
    volumes:
      # Irreplaceable local data lives OUTSIDE the repository. Not preference:
      # `git clean -xdf` deletes ignored files, and this directory holds the
      # hand-typed seed plus a database whose reading_history is never
      # reconstructible — the "capture today what is unrecoverable tomorrow"
      # principle in the data-model spec. A .gitignore stops you committing it,
      # not losing it. Override DATA_DIR per server; the default is a sibling
      # of the repo.
      - ${DATA_DIR:-../manga-tracker-data}:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # A ceiling, not a reservation: nothing is set aside, the container simply
    # cannot grow past this. Steady state is ~75 MiB, so 512 MiB is roughly 6x
    # headroom. The goal is not a smaller container — it is that a leak here
    # stays a manga-tracker incident instead of taking the host down with it.
    mem_limit: 512m
    # Equal to mem_limit means: no swap for this container. Same reasoning as
    # the host-side dev-agent slice — a process thrashing swap stalls every
    # other process on the box waiting for the disk, so failing fast is the
    # kinder outcome. Docker requires this to be >= mem_limit.
    memswap_limit: 512m
    # Detection is the one process on this host that must survive a global
    # out-of-memory event, because a missed publication is not recoverable on
    # the next run: the source only reports what moved today. A negative
    # adjustment biases the kernel's victim selection so that almost anything
    # else on the machine — panel, lab stack, an agent's test run — is killed
    # first. Range is -1000..1000; the daemon sets it at container start.
    oom_score_adj: -500
    # Deploy note (design D5): the jobstore is in memory, so a restart forgets
    # any active_sweep window it missed. That used to mean a manual
    # `run-job active_sweep` after every off-window restart, or up to ~47h
    # without a guaranteed sweep. The `run` subcommand now reads job_runs at
    # startup and runs one sweep immediately when the last successful one is
    # older than a day, so a restart no longer needs a human to remember.
    # `run-job active_sweep` remains available for forcing one on demand.

  # V1b panel (spec-panel-v1b.md): SAME image, own container, by owner
  # decision — a crashed or hung panel must never take detection down with
  # it. No `build:` here on purpose: the service above builds and tags the
  # image; declaring build twice would race two builds of the same tag.
  # Both processes open the same SQLite file; busy_timeout is set in
  # storage, and WAL is the declared lever if real SQLITE_BUSY shows up.
  manga-tracker-panel:
    image: manga-tracker
    container_name: manga-tracker-panel
    restart: unless-stopped
    command: ["panel"]
    env_file:
      - .env
    environment:
      DB_PATH: data/manga-tracker.db
    ports:
      # One knob: PANEL_PORT feeds both the bind inside the container (the
      # CLI reads it from the environment) and the host mapping, so setting
      # it once in .env moves both ends together. Unset, both sides are 8000.
      - "${PANEL_PORT:-8000}:${PANEL_PORT:-8000}"
    volumes:
      - ${DATA_DIR:-../manga-tracker-data}:/app/data
    depends_on:
      - manga-tracker
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Steady state is ~48 MiB. Same ceiling as detection rather than a tighter
    # one, because the panel is the surface that will grow: it is the process
    # that renders lists and will hold query results in memory.
    mem_limit: 512m
    memswap_limit: 512m
    # Deliberately less protected than detection, and this is the same decision
    # the service comment above already records: a hung panel must never take
    # detection down. Under global memory pressure the panel is the acceptable
    # loss — it serves a reader who can reload, while detection missing a
    # window loses data nothing can reconstruct. Still below the host default
    # of 0, so both stay preferable to the lab stack and to agent processes.
    oom_score_adj: -200
